services:
  - type: web
    name: glow-cycle
    runtime: node
    plan: free
    buildCommand: corepack pnpm run render:build
    startCommand: corepack pnpm run render:start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PORT
        value: 10000
      - key: BASE_PATH
        value: /
      - key: SESSION_SECRET
        generateValue: true
      - key: OTP_EXPIRE_MINUTES
        value: 5
      - key: DATABASE_URL
        fromDatabase:
          name: glow-cycle-db
          property: connectionString
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false

databases:
  - name: glow-cycle-db
    plan: free
