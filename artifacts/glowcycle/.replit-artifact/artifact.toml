kind = "web"
previewPath = "/"
title = "GlowCycle"
version = "1.0.0"
id = "artifacts/glowcycle"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25347

[services.development]
run = "pnpm --filter @workspace/glowcycle run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/glowcycle", "run", "build" ]
publicDir = "artifacts/glowcycle/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25347"
BASE_PATH = "/"
